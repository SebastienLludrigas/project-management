<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Project Management</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f8fb;
      color: #032147;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
      text-align: center;
      max-width: 480px;
    }
    h1 { margin-top: 0; color: #032147; }
    p { color: #888888; }
    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(32, 157, 215, 0.1);
      color: #209dd7;
      border-radius: 9999px;
      font-weight: 600;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kanban Backend Ready</h1>
    <p>Scaffolding operational. Serving static files and FastAPI backend.</p>
    <div id="status" class="status">Checking API...</div>
  </div>
  <script>
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').textContent = 'API Health: ' + data.status;
      })
      .catch(err => {
        document.getElementById('status').textContent = 'API Error';
      });
  </script>
</body>
</html>
